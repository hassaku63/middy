version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive
    - gocritic
    - depguard
    # Size and complexity budgets (ADR-0007): generous on purpose. Hitting
    # one is a signal to split, not a style nit.
    - funlen
    - gocognit
    - gocyclo
    # Widely recommended checks that found nothing when they were turned on
    # (ADR-0029, BL-150). They keep it that way.
    - contextcheck
    - copyloopvar
    - dupl
    - bodyclose
    - errname
    - gosec
    - intrange
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - sloglint
    - unparam
    - usestdlibvars
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen, gocognit, gocyclo]
      # Test helpers (postJSON, get) close response bodies in t.Cleanup,
      # which bodyclose cannot follow. Production code is checked in full.
      - path: _test\.go
        linters: [bodyclose]
  settings:
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    # Architecture boundaries (ADR-0007). Rules, not conventions.
    depguard:
      rules:
        music-is-pure:
          # The theory engine depends on nothing but the standard library and
          # itself, and never performs I/O.
          list-mode: strict
          files:
            - "**/internal/music/**/*.go"
          allow:
            - $gostd
            - github.com/hassaku63/middy/backend/internal/music
          deny:
            - pkg: os
              desc: internal/music must not touch the OS
            - pkg: net
              desc: internal/music must not do networking
            - pkg: io/fs
              desc: internal/music must not read files
        httpapi-uses-ports-only:
          # Handlers see llm.Client, never a concrete adapter; wiring is main's job.
          list-mode: lax
          files:
            - "**/internal/httpapi/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/hassaku63/middy/backend/internal/llm/fake
              desc: inject llm.Client through Deps instead of importing an adapter
            - pkg: github.com/hassaku63/middy/backend/internal/llm/anthropic
              desc: inject llm.Client through Deps instead of importing an adapter
        no-http-outside-boundaries:
          # Only the HTTP layer, the entrypoint and LLM adapters speak HTTP.
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "!**/internal/httpapi/**"
            - "!**/internal/llm/**"
            - "!**/*_test.go"
          deny:
            - pkg: net/http
              desc: HTTP belongs to internal/httpapi, cmd/server and LLM adapters
    # Loggers come through Deps or Config, never the global (conventions.md).
    sloglint:
      no-global: default
      forbidden-keys: [err]
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]

# Show every finding, not the first 3 of each kind: a lint PR fixes them all
# (ADR-0029).
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hassaku63/middy
