version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive
    - gocritic
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hassaku63/middy
