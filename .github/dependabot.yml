version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # typescript-eslint pins TypeScript below 6.1; lift this when it supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must track the Node major in `engines` (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 1.6.28 and later need TypeScript 6; held at 1.6.27 until then (BL-159).
      - dependency-name: "@vitest/eslint-plugin"
        versions: [">=1.6.28"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
