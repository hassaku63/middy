version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # typescript-eslint pins TypeScript below 6.1; lift this when it supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must track the Node major in `engines` (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 1.6.28 and later need TypeScript 6; held at 1.6.27 until then (BL-159).
      - dependency-name: "@vitest/eslint-plugin"
        versions: [">=1.6.28"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Dockerfile's base images (#408). node and golang take their versions
  # from .tool-versions through build args, which Dependabot cannot resolve,
  # so this tracks the nginx image of the web target; distroless's `nonroot`
  # is not a version. A new nginx line ending (1.27 stopped in 2025-06) shows
  # up as a PR instead of going unnoticed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        patterns: ["*"]
        update-types: ["major"]
