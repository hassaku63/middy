# Weekly dependency audit (ADR-0007, "prune"). Fails loudly so GitHub
# notifies the owner; the fix is a dependency bump, not a code change.
name: security audit

on:
  schedule:
    - cron: '23 2 * * 1' # Mondays 02:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false
      # Pinned, so a release that needs a newer Go than .tool-versions cannot
      # break the audit unnoticed; the tool review reports when it falls
      # behind. The vulnerability database is fetched at run time.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
      - run: npm ci --ignore-scripts
      # Production dependencies must be clean; dev tooling is reported only.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical || echo "::warning::dev dependencies have known issues; see output"
