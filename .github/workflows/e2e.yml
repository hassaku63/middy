# End-to-end scenarios against the production image (ADR-0008).
# Manual to start with; promote to pull_request once the suite proves stable.
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1' # Mondays 03:41 UTC, after the security audit

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Toolchain versions from .tool-versions
        id: tv
        run: |
          echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: middy:e2e
          build-args: |
            VERSION=${{ github.sha }}
            GO_VERSION=${{ steps.tv.outputs.go }}
            NODE_VERSION=${{ steps.tv.outputs.node }}
          cache-from: type=gha
      - name: Run the container
        run: |
          docker run -d --name app -p 8080:8080 middy:e2e
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/v1/health && break; sleep 1; done
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Container logs
        if: always()
        run: docker logs app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
