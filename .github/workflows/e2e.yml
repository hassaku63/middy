# End-to-end scenarios against the production-like stack (ADR-0027): the
# web and api images run together by compose, as `make up` and the CI image
# job do, so the scenarios go through nginx.
# Manual to start with; promote to pull_request once the suite proves stable.
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1' # Mondays 03:41 UTC, after the security audit

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Toolchain versions from .tool-versions
        id: tv
        run: |
          echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Build the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          load: true
          tags: middy-api:e2e
          build-args: |
            VERSION=${{ github.sha }}
            GO_VERSION=${{ steps.tv.outputs.go }}
            NODE_VERSION=${{ steps.tv.outputs.node }}
          cache-from: type=gha,scope=api
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          load: true
          tags: middy-web:e2e
          build-args: |
            NODE_VERSION=${{ steps.tv.outputs.node }}
          cache-from: |
            type=gha,scope=api
            type=gha,scope=web
      - name: Start the stack
        # --wait returns once both HEALTHCHECKs report healthy.
        run: |
          TAG=e2e docker compose up -d --no-build --wait
          bash scripts/smoke.sh http://localhost:8080 "${{ github.sha }}"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Stack logs
        if: always()
        run: |
          TAG=e2e docker compose logs
          TAG=e2e docker compose down
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
