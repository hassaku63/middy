# End-to-end scenarios against the production-like stack (ADR-0027): the
# web and api images run together by compose, as `make up` and the CI image
# job do, so the scenarios go through nginx.
# Manual to start with; promote to pull_request once the suite proves stable.
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1' # Mondays 03:41 UTC, after the security audit

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # WebKit as well as Chromium (#501): iOS PWAs unlock audio and run
    # service workers differently. WebKit reports without failing the run
    # until its first runs show what it needs.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Toolchain versions from .tool-versions
        id: tv
        run: |
          echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Build the api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          load: true
          tags: middy-api:e2e
          build-args: |
            VERSION=${{ github.sha }}
            GO_VERSION=${{ steps.tv.outputs.go }}
            NODE_VERSION=${{ steps.tv.outputs.node }}
          cache-from: type=gha,scope=api
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: middy-web:e2e
          build-args: |
            NODE_VERSION=${{ steps.tv.outputs.node }}
          cache-from: |
            type=gha,scope=api
            type=gha,scope=web
      - name: Start the stack
        # --wait returns once both HEALTHCHECKs report healthy.
        run: |
          TAG=e2e docker compose up -d --no-build --wait
          bash scripts/smoke.sh http://localhost:8080 "${{ github.sha }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - working-directory: frontend
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_BROWSER: ${{ matrix.browser }}
      - name: Stack logs
        if: always()
        run: |
          TAG=e2e docker compose logs
          TAG=e2e docker compose down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report
          retention-days: 7
