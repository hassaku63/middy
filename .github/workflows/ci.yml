name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          # Enable the module cache (cache-dependency-path: backend/go.sum)
          # once the first dependency creates backend/go.sum.
          cache: false
      - name: golangci-lint version from .tool-versions
        id: lint
        run: echo "version=v$(awk '$1 == "golangci-lint" { print $2 }' ../.tool-versions)" >> "$GITHUB_OUTPUT"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint.outputs.version }}
          working-directory: backend
      - name: test
        run: go test -race -cover ./...
      - name: test timing report
        run: bash ../scripts/test-report.sh backend
      - name: build
        run: go build -o bin/server ./cmd/server

  frontend:
    name: frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: generated API types are current
        run: bash ../scripts/check-api-types.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: test timing report
        run: bash ../scripts/test-report.sh frontend
      - run: npm run build
      - name: bundle size budget
        run: bash ../scripts/check-bundle-size.sh dist

  docs:
    name: docs (links, paths, index)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-docs.sh

  image:
    name: image (Docker build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Toolchain versions from .tool-versions
        id: tv
        run: |
          echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: middy:ci
          build-args: |
            VERSION=${{ github.sha }}
            GO_VERSION=${{ steps.tv.outputs.go }}
            NODE_VERSION=${{ steps.tv.outputs.node }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 middy:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"version":"${{ github.sha }}"' health.json
          curl -fsS -o index.html -D headers.txt http://localhost:8080/
          grep -qi 'content-type: text/html' headers.txt
          grep -q '<div id="root">' index.html
          curl -fsS -o /dev/null -D sw.txt http://localhost:8080/sw.js
          grep -qi 'cache-control: no-cache' sw.txt
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health status: $status"
          [ "$status" = "healthy" ]
          docker logs app
          docker rm -f app

  pr-size:
    name: pr size budget
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/check-pr-size.sh origin/${{ github.base_ref }}

  deps:
    name: dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: go.mod / go.sum are tidy
        working-directory: backend
        run: go mod tidy -diff
      - name: production npm dependencies have no high vulnerabilities
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
