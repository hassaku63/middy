name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which jobs this change needs (ADR-0016). Pull requests run only the jobs
  # whose inputs changed (scripts/ci-changes.sh); pushes to main run all.
  # There are no required checks yet, so a skipped job blocks nothing. When
  # they are turned on, add one job that needs all others, treats skipped
  # as success, and make only that job required.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/ci-changes.sh "origin/${{ github.base_ref }}" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'backend=true\nfrontend=true\nimage=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  backend:
    name: backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain versions from .tool-versions
        id: tv
        working-directory: .
        run: |
          echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "lint=v$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      # CI uses the Go the application is built with, not the runner's (ADR-0016).
      # The runner image ships other patches, so keep the pinned one in the
      # tool cache; setup-go then finds it locally instead of downloading it.
      - name: Go toolchain cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.tv.outputs.go }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.tv.outputs.go }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.sum # module and build cache
      - name: golangci-lint binary cache
        id: lint-bin
        uses: actions/cache@v6
        with:
          path: ~/.local/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.tv.outputs.lint }}
      - name: Install golangci-lint (cache miss only)
        if: steps.lint-bin.outputs.cache-hit != 'true'
        run: bash ../scripts/install-golangci-lint.sh "${{ steps.tv.outputs.lint }}" "$HOME/.local/golangci-lint"
      - run: echo "$HOME/.local/golangci-lint" >> "$GITHUB_PATH"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go.mod / go.sum are tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none # the binary on PATH, installed above
          working-directory: backend
      # One run feeds both the log and the timing report (the report used to
      # run the suite a second time).
      - name: test
        run: |
          set -o pipefail
          go test -race -cover -json ./... | tee "$RUNNER_TEMP/go-test.json" \
            | jq -rj 'select(.Action == "output" or .Action == "build-output") | .Output'
      - name: test timing report
        if: ${{ !cancelled() }}
        run: GO_TEST_JSON="$RUNNER_TEMP/go-test.json" bash ../scripts/test-report.sh backend
      - name: build
        run: go build -o bin/server ./cmd/server

  frontend:
    name: frontend (React)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: production npm dependencies have no high vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: generated API types are current
        run: bash ../scripts/check-api-types.sh
      - run: npm run typecheck
      - run: npm run lint
      - name: Unused exports, files and dependencies (knip, ADR-0007)
        run: npm run knip
      - run: npm run format:check
      - name: test
        run: npm test -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
      - name: test timing report
        if: ${{ !cancelled() }}
        run: VITEST_JSON="$RUNNER_TEMP/vitest.json" bash ../scripts/test-report.sh frontend
      - run: npm run build
      - name: bundle size budget
        run: bash ../scripts/check-bundle-size.sh dist

  docs:
    name: docs (links, paths, index)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-docs.sh

  image:
    name: image (Docker build + smoke)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Toolchain versions from .tool-versions
        id: tv
        run: |
          echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: middy:ci
          build-args: |
            VERSION=${{ github.sha }}
            GO_VERSION=${{ steps.tv.outputs.go }}
            NODE_VERSION=${{ steps.tv.outputs.node }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 middy:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"version":"${{ github.sha }}"' health.json
          curl -fsS -o index.html -D headers.txt http://localhost:8080/
          grep -qi 'content-type: text/html' headers.txt
          grep -q '<div id="root">' index.html
          curl -fsS -o /dev/null -D sw.txt http://localhost:8080/sw.js
          grep -qi 'cache-control: no-cache' sw.txt
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health status: $status"
          [ "$status" = "healthy" ]
          docker logs app
          docker rm -f app

  pr-size:
    name: pr size budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/check-pr-size.sh origin/${{ github.base_ref }}
