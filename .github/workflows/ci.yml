name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its run. Every push to main runs to
# the end in a group of its own: it checks only what that push changed
# (ADR-0032), so a cancelled or replaced run would leave a change unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which jobs this change needs (ADR-0016, ADR-0032). Pull requests and
  # pushes to main run only the jobs whose inputs changed
  # (scripts/ci-changes.sh): against the base branch for a pull request,
  # against the previous head of main for a push.
  # Only the `required` job at the end is a required check (ADR-0028): it
  # treats a skipped job as passed, so a change that skips a job is not
  # blocked by it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image: ${{ steps.filter.outputs.image }}
      gomod: ${{ steps.filter.outputs.gomod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # The base branch's version decides (#501): a pull request cannot
            # skip its own jobs by changing the script, and a change to it or
            # to this file runs every job. Kept in .git, the script's
            # "$(dirname "$0")/.." is still the checkout. An output a pull
            # request adds is empty until it is merged.
            git show "origin/$BASE_REF:scripts/ci-changes.sh" > .git/ci-changes-base.sh
            bash .git/ci-changes-base.sh "origin/$BASE_REF" | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            bash scripts/ci-changes.sh "$BEFORE" | tee -a "$GITHUB_OUTPUT"
          else
            # No previous head to compare with: check everything.
            printf 'backend=true\nfrontend=true\nimage=true\ngomod=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  backend:
    name: backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain versions from .tool-versions
        id: tv
        working-directory: .
        run: |
          echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "lint=v$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      # CI uses the Go the application is built with, not the runner's (ADR-0016).
      # The runner image ships other patches, so keep the pinned one in the
      # tool cache; setup-go then finds it locally instead of downloading it.
      - name: Go toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.tv.outputs.go }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.tv.outputs.go }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.sum # module and build cache
      - name: golangci-lint binary cache
        id: lint-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.tv.outputs.lint }}
      - name: Install golangci-lint (cache miss only)
        if: steps.lint-bin.outputs.cache-hit != 'true'
        run: bash ../scripts/install-golangci-lint.sh "${{ steps.tv.outputs.lint }}" "$HOME/.local/golangci-lint"
      - run: echo "$HOME/.local/golangci-lint" >> "$GITHUB_PATH"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go.mod / go.sum are tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none # the binary on PATH, installed above
          working-directory: backend
      # One run feeds both the log and the timing report (the report used to
      # run the suite a second time).
      - name: test
        run: |
          set -o pipefail
          go test -race -cover -json ./... | tee "$RUNNER_TEMP/go-test.json" \
            | jq -rj 'select(.Action == "output" or .Action == "build-output") | .Output'
      - name: test timing report
        if: ${{ !cancelled() }}
        run: GO_TEST_JSON="$RUNNER_TEMP/go-test.json" bash ../scripts/test-report.sh backend
      - name: build
        run: go build -o bin/server ./cmd/server
      # A changed go.mod may bring a known vulnerability in (#502). Reported
      # here, not failing: the weekly audit (security.yml) is the one that
      # fails. The same pinned version as there.
      - name: govulncheck (go.mod changed; report only)
        if: needs.changes.outputs.gomod == 'true'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... \
            || echo "::warning::govulncheck reports known vulnerabilities; see the step's output"

  frontend:
    name: frontend (React)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: production npm dependencies have no high vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: generated API types are current
        run: bash ../scripts/check-api-types.sh
      - run: npm run typecheck
      - run: npm run lint
      - name: Unused exports, files and dependencies (knip, ADR-0007)
        run: npm run knip
      - run: npm run format:check
      - name: test
        run: npm test -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
      - name: test timing report
        if: ${{ !cancelled() }}
        run: VITEST_JSON="$RUNNER_TEMP/vitest.json" bash ../scripts/test-report.sh frontend
      - run: npm run build
      - name: bundle size budget
        run: bash ../scripts/check-bundle-size.sh dist

  # The shell scripts every job and `make check` call, and the workflows
  # themselves. Runs on every pull request: it takes seconds. shellcheck
  # comes with the runner image; actionlint is built at the version in
  # .tool-versions and cached by it.
  shell:
    name: shell, workflows and Dockerfile (shellcheck, actionlint, hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint version from .tool-versions
        id: tv
        run: echo "actionlint=$(awk '$1 == "actionlint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: actionlint binary cache
        id: al-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/actionlint
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-${{ steps.tv.outputs.actionlint }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.al-bin.outputs.cache-hit != 'true'
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Install actionlint (cache miss only)
        if: steps.al-bin.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/.local/actionlint" go install "github.com/rhysd/actionlint/cmd/actionlint@v${{ steps.tv.outputs.actionlint }}"
      - run: echo "$HOME/.local/actionlint" >> "$GITHUB_PATH"
      - run: shellcheck --version && actionlint -version
      - run: make shell-lint actions-lint
      # The pinned hadolint image; docker comes with the runner image.
      - run: make dockerfile-lint

  docs:
    name: docs (links, paths, index)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-docs.sh

  image:
    name: image (Docker build + smoke)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Toolchain versions from .tool-versions
        id: tv
        run: |
          echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      # BuildKit's build checks (#408): rules hadolint does not have, such
      # as undefined variables and secrets in ARG or ENV. A violation fails.
      # They need the Dockerfile syntax 1.8 or later.
      - name: Build checks
        run: |
          docker buildx build --check --target api .
          docker buildx build --check --target web .
      # The two images of ADR-0027, run together by compose as `make up` does.
      - name: Build the api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          load: true
          tags: middy-api:ci
          build-args: |
            VERSION=${{ github.sha }}
            GO_VERSION=${{ steps.tv.outputs.go }}
            NODE_VERSION=${{ steps.tv.outputs.node }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: middy-web:ci
          build-args: |
            NODE_VERSION=${{ steps.tv.outputs.node }}
          cache-from: |
            type=gha,scope=api
            type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test the stack
        # --wait returns once both HEALTHCHECKs report healthy.
        run: |
          TAG=ci docker compose up -d --no-build --wait
          bash scripts/smoke.sh http://localhost:8080 "${{ github.sha }}"
      - name: Stack logs
        if: always()
        run: |
          TAG=ci docker compose logs
          TAG=ci docker compose down

  # The layout at every size of the matrix, checked by machine (#359): no
  # sideways scroll, axe, the same operations at every width, the pinned
  # chord kept across a resize. Only these deterministic checks; the rest of
  # the E2E stays weekly (e2e.yml), and screens for review stay out of CI.
  # It runs the Go server (fake LLM) and `vite preview`, which proxies /api
  # as the dev server does, so it needs no images and no registry (ADR-0028).
  layout:
    name: layout (E2E at every size)
    needs: changes
    # The screens are drawn from the real API's answers (the fake LLM), so a
    # change to the backend can break the layout too (#501).
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API (fake LLM)
        working-directory: backend
        run: |
          go build -o bin/server ./cmd/server
          PORT=8080 LLM_PROVIDER=fake nohup bin/server > ../server.log 2>&1 &
      - name: Build and serve the frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &
          npx playwright install --with-deps chromium
      - name: Layout checks at every size
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
        run: npx playwright test e2e/sizes.spec.ts --trace off
      - name: Server logs
        if: failure()
        run: tail -n 50 server.log preview.log

  pr-size:
    name: pr size budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/check-pr-size.sh origin/${{ github.base_ref }}

  # The one required check on main (ADR-0028, #219). It covers what
  # `make check` covers: the jobs that pick (changes), test and lint the code
  # (backend, frontend), check the layout at every size (layout), lint the
  # scripts (shell) and check the docs. A skipped job passes; a failed or
  # cancelled one fails this. `always()` keeps it from being skipped, and so
  # counted as passed, when a job it needs fails. image and pr-size are left
  # out on purpose: see the ADR.
  required:
    name: required (make check)
    needs: [changes, backend, frontend, layout, shell, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended as $r"; exit 1 ;;
            esac
          done
