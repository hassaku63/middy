# Real-API evaluation of a pull request (ADR-0018). Runs `make eval` on the
# pull request's branch when someone with write access adds the `eval`
# label, posts the table as a comment and removes the label, so the label
# can be added again after the next fix.
#
# Guards (all required, ADR-0018):
# - Only `pull_request`, never `pull_request_target`, and only for branches
#   of this repository: a fork's pull request never runs this job and never
#   gets the key.
# - The key lives in the `eval` environment and is passed to one step only,
#   the one that runs the evaluation.
# - The job that can write to the pull request runs none of its code.
name: eval

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# Every label creates a run, and concurrency acts on runs, not jobs: keep the
# runs of other labels (which skip every job) in their own group, or they
# would cancel an evaluation in progress.
concurrency:
  group: eval-${{ github.event.pull_request.number }}-${{ github.event.label.name == 'eval' }}
  cancel-in-progress: true

jobs:
  eval:
    name: eval (real API)
    if: >-
      github.event.label.name == 'eval' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: eval
    outputs:
      ran: ${{ steps.changes.outputs.eval }}
      outcome: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false # the evaluated code must not find a token
      - name: Does this change affect what the model is told?
        id: changes
        run: bash scripts/ci-changes.sh "origin/${{ github.base_ref }}" | grep '^eval=' | tee -a "$GITHUB_OUTPUT"
      - name: Toolchain versions from .tool-versions
        if: steps.changes.outputs.eval == 'true'
        id: tv
        run: echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Go toolchain cache
        if: steps.changes.outputs.eval == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.tv.outputs.go }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.tv.outputs.go }}
      - uses: actions/setup-go@v7
        if: steps.changes.outputs.eval == 'true'
        with:
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.sum
      # The only step that sees the key.
      - name: make eval
        id: run
        if: steps.changes.outputs.eval == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::the eval environment has no ANTHROPIC_API_KEY"
            exit 1
          fi
          make eval 2>&1 | tee "$RUNNER_TEMP/eval.log"
      - name: Extract the report
        if: always() && steps.changes.outputs.eval == 'true'
        run: |
          mkdir -p report
          awk '/^\| case \|/ { on = 1 } /^(--- (PASS|FAIL)|PASS$|FAIL$)/ { on = 0 } on' "$RUNNER_TEMP/eval.log" > report/report.md || true
          [ -s report/report.md ] || echo "評価の表が出力されませんでした（ログを参照）。" > report/report.md
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.eval == 'true'
        with:
          name: eval-report
          path: report/report.md
          retention-days: 14

  report:
    name: report and remove the label
    needs: eval
    if: >-
      always() &&
      github.event.label.name == 'eval' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write # comments and labels of a pull request go through the issues API
    steps:
      - uses: actions/download-artifact@v8
        if: needs.eval.outputs.ran == 'true'
        continue-on-error: true
        with:
          name: eval-report
          path: report
      - name: Comment with the result
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RAN: ${{ needs.eval.outputs.ran }}
          OUTCOME: ${{ needs.eval.outputs.outcome }}
          RESULT: ${{ needs.eval.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ "$RAN" = "false" ]; then
              echo "評価の対象がない変更なので、評価は走らせませんでした（${SHA:0:7}）。"
            elif [ "$RAN" != "true" ]; then
              echo "評価のジョブが途中で止まりました（${SHA:0:7}、${RESULT}、[ログ]($RUN_URL)）。"
            else
              echo "評価の結果（${SHA:0:7}、${OUTCOME}、[ログ]($RUN_URL)）"
              echo
              cat report/report.md 2>/dev/null || echo "評価の表を取得できませんでした。"
            fi
          } > body.md
          # REST rather than `gh pr`, whose GraphQL calls can be refused for GITHUB_TOKEN.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md --silent
      - name: Remove the eval label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A label that is already gone is fine; any other failure must show.
          if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/eval" --silent 2> err.txt; then
            if grep -q "Label does not exist" err.txt; then
              echo "the label was already gone"
            else
              cat err.txt
              exit 1
            fi
          fi
