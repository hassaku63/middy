# Real-API evaluation of a pull request (ADR-0018). Runs on the pull
# request's branch when someone with write access adds an evaluation
# label, posts the table as a comment and removes the label, so the label
# can be added again after the next fix. "needs-" marks a request still
# waiting; the part after "needs-eval-" names what runs, and the part
# after ":" narrows it (ADR-0063):
#   needs-eval-cases        every case of `make eval`, and the independent
#                           reviewer
#   needs-eval-cases:<tag>  the cases with that tag (evals.Tags, e.g. meter)
#                           and the smoke cases, to spend less credit on one
#                           aspect (#334)
#   needs-eval-converse     a conversation measured by cmd/converse (#453,
#                           BL-313)
#   needs-eval-scenarios    the scripted conversations of cmd/converse, and
#                           the conversation reviewer (#473, BL-316)
# A run of many cases (the full one) goes as Message Batches, at half the
# price, and waits longer for the answers; a small one sends one request at
# a time (EVAL_BATCH=auto, ADR-0039).
#
# Guards (all required, ADR-0018):
# - Only `pull_request`, never `pull_request_target`, and only for branches
#   of this repository: a fork's pull request never runs this job and never
#   gets the key.
# - The key lives in the `eval` environment and is passed to one step only,
#   the one that runs the evaluation.
# - The job that can write to the pull request runs none of its code.
name: eval

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# Every label creates a run, and concurrency acts on runs, not jobs: keep the
# runs of other labels (which skip every job) in their own group, or they
# would cancel an evaluation in progress.
concurrency:
  group: eval-${{ github.event.pull_request.number }}-${{ github.event.label.name == 'needs-eval-cases' || github.event.label.name == 'needs-eval-converse' || github.event.label.name == 'needs-eval-scenarios' || startsWith(github.event.label.name, 'needs-eval-cases:') }}
  cancel-in-progress: true

jobs:
  eval:
    name: eval (real API)
    if: >-
      (github.event.label.name == 'needs-eval-cases' || github.event.label.name == 'needs-eval-converse' || github.event.label.name == 'needs-eval-scenarios' || startsWith(github.event.label.name, 'needs-eval-cases:')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A full run waits for Message Batches (EVAL_TIMEOUT below, ADR-0039).
    timeout-minutes: 90
    environment: eval
    outputs:
      ran: ${{ steps.changes.outputs.eval }}
      outcome: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the evaluated code must not find a token
      - name: Does this change affect what the model is told?
        id: changes
        run: bash scripts/ci-changes.sh "origin/${{ github.base_ref }}" | grep '^eval=' | tee -a "$GITHUB_OUTPUT"
      - name: Toolchain versions from .tool-versions
        if: steps.changes.outputs.eval == 'true'
        id: tv
        run: echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
      - name: Go toolchain cache
        if: steps.changes.outputs.eval == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.tv.outputs.go }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.tv.outputs.go }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.eval == 'true'
        with:
          go-version-file: .tool-versions
          cache-dependency-path: backend/go.sum
      # The only step that sees the key. The label is written by someone
      # with write access, but it is still read as data: only a lowercase
      # word passes on, and the eval rejects a tag it does not know.
      - name: make eval
        id: run
        if: steps.changes.outputs.eval == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LABEL: ${{ github.event.label.name }}
        run: |
          set -o pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::the eval environment has no ANTHROPIC_API_KEY"
            exit 1
          fi
          case "$LABEL" in
            needs-eval-converse | needs-eval-scenarios)
              # Conversations instead of the cases (#453, #473): the
              # server and the conversation reviewer get the key, the
              # client that sends the conversations does not.
              bash scripts/converse-ci.sh "${LABEL#needs-eval-}" report/report.md
              exit 0
              ;;
            needs-eval-cases) ;;
            needs-eval-cases:*)
              tag="${LABEL#needs-eval-cases:}"
              if ! [[ "$tag" =~ ^[a-z]+$ ]]; then
                echo "::error::the label's tag must be a lowercase word, got: $tag"
                exit 1
              fi
              export EVAL_TAGS="$tag,smoke"
              ;;
            *)
              echo "::error::not an evaluation label: $LABEL"
              exit 1
              ;;
          esac
          # Message Batches for a run of EVAL_BATCH_MIN cases or more (the
          # full run); a small narrowed run goes one request at a time.
          export EVAL_BATCH=auto EVAL_TIMEOUT=80m
          make eval 2>&1 | tee "$RUNNER_TEMP/eval.log"
      - name: Extract the report
        if: always() && steps.changes.outputs.eval == 'true'
        run: |
          mkdir -p report
          # The conversation labels wrote their report already.
          if [ ! -s report/report.md ]; then
            awk '/^\| case \|/ { on = 1 } /^(--- (PASS|FAIL)|PASS$|FAIL$)/ { on = 0 } on' "$RUNNER_TEMP/eval.log" > report/report.md || true
          fi
          [ -s report/report.md ] || echo "評価の表が出力されませんでした（ログを参照）。" > report/report.md
          # The report is written by the code under evaluation, and GitHub
          # masks secrets in logs only: nothing shaped like a key leaves the
          # job, in the summary, the artifact or the comment (#502).
          if ! bash scripts/check-no-secrets.sh report/report.md; then
            echo "報告に鍵の形の文字列があったため、表を出しませんでした（ログを参照）。" > report/report.md
            exit 1
          fi
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.changes.outputs.eval == 'true'
        with:
          name: eval-report
          path: report/report.md
          retention-days: 14

  report:
    name: report and remove the label
    needs: eval
    if: >-
      always() &&
      (github.event.label.name == 'needs-eval-cases' || github.event.label.name == 'needs-eval-converse' || github.event.label.name == 'needs-eval-scenarios' || startsWith(github.event.label.name, 'needs-eval-cases:')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write # comments and labels of a pull request go through the issues API
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.eval.outputs.ran == 'true'
        continue-on-error: true
        with:
          name: eval-report
          path: report
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/check-no-secrets.sh
          sparse-checkout-cone-mode: false
      - name: Comment with the result
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RAN: ${{ needs.eval.outputs.ran }}
          OUTCOME: ${{ needs.eval.outputs.outcome }}
          RESULT: ${{ needs.eval.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ "$RAN" = "false" ]; then
              echo "評価の対象がない変更なので、評価は走らせませんでした（${SHA:0:7}）。"
            elif [ "$RAN" != "true" ]; then
              echo "評価のジョブが途中で止まりました（${SHA:0:7}、${RESULT}、[ログ]($RUN_URL)）。"
            else
              echo "評価の結果（${SHA:0:7}、${OUTCOME}、[ログ]($RUN_URL)）"
              echo
              cat report/report.md 2>/dev/null || echo "評価の表を取得できませんでした。"
            fi
          } > body.md
          # Checked again here, where it is posted (#502): a match posts a
          # notice instead of the table, and fails.
          leak=false
          if ! bash scripts/check-no-secrets.sh body.md; then
            leak=true
            echo "評価の報告に鍵の形の文字列があったため、表を投稿しませんでした（${SHA:0:7}、[ログ]($RUN_URL)）。" > body.md
          fi
          # REST rather than `gh pr`, whose GraphQL calls can be refused for GITHUB_TOKEN.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md --silent
          [ "$leak" = false ]
      - name: Remove the label that started the run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        run: |
          # A label that is already gone is fine; any other failure must show.
          # The name goes in the path, so its ":" is escaped.
          if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/${LABEL//:/%3A}" --silent 2> err.txt; then
            if grep -q "Label does not exist" err.txt; then
              echo "the label was already gone"
            else
              cat err.txt
              exit 1
            fi
          fi
