# Security headers for every response of the web container (#206 A-4,
# ADR-0027). nginx drops the server's add_header lines in a location that
# has its own, so this file is included at the server level and again in
# each location that adds a header. `always` puts them on errors too.
#
# The CSP allows this origin only: the build has no inline script or style
# and no other host (frontend/index.html, vite.config.ts); style attributes
# React sets through the CSSOM are not inline styles. The E2E runs with it.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
