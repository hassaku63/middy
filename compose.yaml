# Production-like local verification (ADR-0008): one container serving the
# UI and the API on http://localhost:8080, built from this checkout.
#
#   make up                                               # fake LLM
#   LLM_PROVIDER=anthropic ANTHROPIC_API_KEY=... make up  # real LLM
#
# Settings reach the container only through `environment` below, from the
# environment of the command that starts compose (ADR-0011). The repository
# keeps no settings file (compose would still interpolate a project-root .env;
# do not create one), so a secrets tool can wrap the command: `<tool> -- make up`.
#
# The development loop stays native (`make dev-backend`, `make dev-frontend`).
services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-compose}
        GO_VERSION: ${GO_VERSION:-1.25}
        NODE_VERSION: ${NODE_VERSION:-22}
    image: middy:local
    ports:
      - "${PORT:-8080}:8080"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    restart: unless-stopped
