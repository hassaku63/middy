# Production-like local verification (ADR-0027): the web container (nginx and
# the SPA) on http://localhost:8080 passes /api to the api container, which is
# not published. The ports and the API_UPSTREAM name match the deployment.
# WEB_PORT changes the published port; PORT is each container's own.
#
#   make up                                               # fake LLM
#   LLM_PROVIDER=anthropic ANTHROPIC_API_KEY=... make up  # real LLM
#
# Settings reach the container only through `environment` below, from the
# environment of the command that starts compose (ADR-0011). The repository
# keeps no settings file (compose would still interpolate a project-root .env;
# do not create one), so a secrets tool can wrap the command: `<tool> -- make up`.
#
# The development loop stays native (`make dev-backend`, `make dev-frontend`).
services:
  web:
    build:
      context: .
      target: web
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    image: middy-web:${TAG:-local}
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      API_UPSTREAM: http://api:8081
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
      args:
        VERSION: ${VERSION:-compose}
        GO_VERSION: ${GO_VERSION:-1.25}
        NODE_VERSION: ${NODE_VERSION:-22}
    image: middy-api:${TAG:-local}
    expose:
      - "8081"
    environment:
      PORT: "8081"
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    restart: unless-stopped
