openapi: 3.1.0
info:
  title: middy API
  version: 0.1.0
  description: |
    middy のバックエンド API。この文書が契約の正典であり（ADR-0004）、
    `backend/internal/httpapi` と `frontend/src/shared/api` はこれに追従する。

    `components.schemas` のドメインモデル部分は `backend/internal/music` の
    JSON 表現と 1:1 で対応する。
servers:
  - url: /api/v1
tags:
  - name: system
    description: 稼働確認
  - name: timelines
    description: タイムラインの生成と分析
  - name: export
    description: 書き出し
  - name: patterns
    description: 伴奏・ドラムのテンプレート
  - name: ideas
    description: イメージからの候補提案（S2）
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: サーバーの稼働状態を返す
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: dev
  /timelines/from-progression:
    post:
      tags: [timelines]
      operationId: createTimelineFromProgression
      summary: ローマ数字の進行を調で解決し、分析済みのタイムラインを返す
      description: |
        進行をブロックコード 1 トラックとして展開し（`music.FromProgression`）、
        各コードに和声機能・終止・解説を付けて（`music.Analyze`）返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromProgressionRequest'
            example:
              key: { tonic: 0, mode: major }
              tempoBpm: 90
              progression:
                - { numeral: I }
                - { numeral: V, beats: 2 }
                - { numeral: vi, beats: 2 }
                - { numeral: IV }
      responses:
        '200':
          description: 生成・分析済みのタイムライン
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '400':
          description: |
            `invalid_json`（本文が JSON として読めない、未知のフィールド、未知の mode）
            または `invalid_request`（進行が空、ローマ数字が不正、beats < 1、tempoBpm が 10〜1000 の外）。
            不正なローマ数字は全件まとめて message に列挙される
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: "`internal_error`（作ったタイムラインを分析できなかった。エンジンの不具合で、原因はサーバーのログにだけ残る）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patterns:
    get:
      tags: [patterns]
      operationId: listPatterns
      summary: 伴奏とドラムのテンプレート一覧
      description: id を `POST /timelines/from-progression` の `accompaniment` / `drums` に渡す。
      responses:
        '200':
          description: カタログ（安定した順序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternsResponse'
  /export/midi:
    post:
      tags: [export]
      operationId: exportMidi
      summary: タイムラインを Standard MIDI File（format 0）として返す
      description: |
        `analysis` など再生に関係しないフィールドは無視される。
        トラックのチャンネルとプログラムは保持され、トラック名は保持されない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeline]
              properties:
                timeline:
                  $ref: '#/components/schemas/Timeline'
      responses:
        '200':
          description: 'SMF のバイト列。`Content-Disposition: attachment; filename="middy.mid"`'
          content:
            audio/midi:
              schema:
                type: string
                format: binary
        '400':
          description: "`invalid_json` または `invalid_request`（`Timeline.Validate` の失敗）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: "`internal_error`（検証を通ったタイムラインを書き出せなかった。エンコーダの不具合で、原因はサーバーのログにだけ残る）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ideas:
    post:
      tags: [ideas]
      operationId: imagine
      summary: イメージの会話 1 ターン分を解釈し、再生可能な候補を返す
      description: |
        会話履歴（最後は user）を LLM に渡して `MusicalIntent` を得て、候補ごとに
        進行を調で解決・分析したタイムラインを返す（`ideas.Service.Imagine`）。
        サーバーは会話状態を持たない。assistant 側の履歴にはこの応答の `reply` を入れて送り返す。
        LLM が不正な答えを返した場合は検証エラーを添えて、安全上の理由で拒否した場合は同じ要求のまま、
        それぞれ 1 回だけ再試行する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeasRequest'
            example:
              messages:
                - { role: user, content: 雨の日曜の午後みたいな曲 }
      responses:
        '200':
          description: 返答と候補
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeasResponse'
        '400':
          description: "`invalid_json`、または `invalid_request`（空・20 件超・1000 文字超・最後が user でない）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: "`llm_declined`（プロバイダの安全機構が再試行後も拒否した。言い回しを変えれば通ることが多い）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: "`internal_error`（検証を通った答えから例を作れなかった。エンジンの不具合）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: "`llm_unavailable`（プロバイダに到達できない）または `llm_invalid_output`（再試行後も使えない答え）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: ビルド時に埋め込まれるバージョン。開発時は "dev"
    Error:
      description: すべてのエラー応答が使う共通エンベロープ
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: snake_case の安定した識別子（例 invalid_request）
            message:
              type: string
              description: 開発者向けの英語の説明。UI には出さず、画面の文言は code から選ぶ

    FromProgressionRequest:
      type: object
      required: [key, tempoBpm, progression]
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/Key'
        tempoBpm:
          type: number
          description: 拍子の拍が 1 分に何回か（4/4・3/4 では 4 分音符、6/8 では付点 4 分。ADR-0019）
          minimum: 10
          maximum: 1000
        progression:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProgressionLabel'
        accompaniment:
          type: string
          description: 伴奏テンプレートの id（`GET /patterns`）。省略時はブロックコード
        drums:
          type: string
          description: ドラムテンプレートの id（`GET /patterns`）。省略時はドラムなし
        drumGrid:
          $ref: '#/components/schemas/DrumGrid'
          description: 格子で書いたドラム（BL-123）。`drums` と同時には指定できない
        feel:
          $ref: '#/components/schemas/Feel'
        style:
          type: string
          description: スタイルの id（`GET /patterns` の styles）。鍵盤を既定とする型の音色をスタイルの楽器にし、タイムラインに記録する（BL-110）。型がスタイルに合うかは検査しない
        timeSignature:
          $ref: '#/components/schemas/TimeSignature'
          description: 拍子。4/4、3/4、6/8 のどれか。省略時は 4/4。progression の beats はこの拍子の拍で数える（ADR-0017）
    Feel:
      type: string
      enum: [straight, swing]
      description: 8 分音符のノリ。swing は裏拍を遅らせる（長・短の比はテンポから決まる。BL-084）。伴奏かドラムがあるときに効く。6/8 では拍がすでに 3 つに分かれるので swing は使えない。省略時は straight
    PatternsResponse:
      type: object
      required: [accompaniments, drums, feels, styles]
      properties:
        accompaniments:
          type: array
          items:
            $ref: '#/components/schemas/Accompaniment'
        drums:
          type: array
          items:
            $ref: '#/components/schemas/DrumPattern'
        feels:
          type: array
          items:
            $ref: '#/components/schemas/FeelInfo'
        styles:
          type: array
          items:
            $ref: '#/components/schemas/Style'
    Style:
      description: スタイル（BL-082）。合う伴奏・ドラム・ノリの一覧を持つ。ブロックの和音とドラムなしはどのスタイルでも使える
      type: object
      required: [id, name, description, accompaniments, drums, feels, grooves]
      properties:
        id: { type: string, examples: [celtic] }
        name: { type: string, examples: [ケルト] }
        description: { type: string }
        accompaniments: { type: array, items: { type: string } }
        drums: { type: array, items: { type: string } }
        feels: { type: array, items: { $ref: '#/components/schemas/Feel' } }
        program: { type: integer, description: 鍵盤を既定とする型をこの GM の音色で鳴らす（BL-110）。省略時は型のまま }
        instrument: { type: string, description: その楽器の名前 }
        tensions:
          type: object
          description: スタイルの和音の色付け（BL-125、ADR-0012 の決定 4）。エンジンが足し、ローマ数字は 7 度まで
          required: [text]
          properties:
            ninths: { type: boolean, description: 長七・短七・属七に 9 度 }
            thirteenths: { type: boolean, description: 属七に 13 度 }
            add9: { type: boolean, description: 長三和音に 9 度 }
            text: { type: string }
        grooves:
          type: array
          description: 拍子ごとのこのスタイルのグルーヴ（BL-087）。例のスタイルを選び直すと、和声はそのままでこれで作り直す
          items:
            $ref: '#/components/schemas/Groove'
    Groove:
      description: あるスタイルがある拍子で鳴らす型。そのスタイルの一覧のうち、その拍子で使える最初の伴奏・ドラム・ノリ（拍子のために書かれた伴奏を優先）
      type: object
      required: [meter, accompaniment, feel]
      properties:
        meter:
          $ref: '#/components/schemas/TimeSignature'
        accompaniment: { type: string, description: その拍子の伴奏がなければ block }
        drums: { type: string, description: その拍子のドラムがなければ省略 }
        feel:
          $ref: '#/components/schemas/Feel'
    FeelInfo:
      type: object
      required: [id, name, description]
      properties:
        id:
          $ref: '#/components/schemas/Feel'
        name: { type: string }
        description: { type: string, description: 学習者向けの説明（日本語） }
    Accompaniment:
      type: object
      required: [id, name, description, program, hits]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, description: 学習者向けの説明（日本語） }
        program: { type: integer, description: GM プログラム番号 }
        meter:
          $ref: '#/components/schemas/TimeSignature'
          description: この型が書かれた拍子。省略時はどの拍子でも使える（block）
        hits:
          type: array
          items:
            type: object
            required: [start, duration, voice, velocity]
            properties:
              start: { type: integer, description: 小節内の tick }
              duration: { type: integer, description: 0 は小節の終わりまで }
              voice: { type: string, enum: [chord, bass, root, third, fifth, top, octave, drone, walk] }
              velocity: { type: integer, minimum: 1, maximum: 127 }
    DrumPattern:
      type: object
      required: [id, name, description, hits]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        meter:
          $ref: '#/components/schemas/TimeSignature'
          description: この型が書かれた拍子
        hits:
          type: array
          items:
            type: object
            required: [start, duration, note, velocity]
            properties:
              start: { type: integer }
              duration: { type: integer }
              note: { type: integer, description: GM ドラムマップのノート番号 }
              velocity: { type: integer, minimum: 1, maximum: 127 }
    ProgressionLabel:
      type: object
      required: [numeral]
      additionalProperties: false
      properties:
        numeral:
          type: string
          description: |
            ローマ数字のコード名。度数（I..VII）と、任意の七の和音指定（7, maj7, ø7, m7b5）。
            大文字・小文字と七の和音の種類は、調から決まる和音と一致しなければならない
            （D minor の IV は「iv として鳴る」として 400。ADR-0013）。例外は短調の大文字 V / V7 で、
            和声的短音階のドミナントになる。長調では同主短調からの借用（iv, ivm6, ♭VI, ♭VII など）、
            どの調でもセカンダリードミナント（V/x, V7/x）と裏コード（subV7/x）と導音の減七（vii°7/x）を書ける（`docs/architecture/domain-model.md`）
          examples: [I, ii, V7, IVmaj7, 'vii°', bVII, V7/V, subV7/I, 'vii°7/ii']
        beats:
          type: integer
          minimum: 1
          description: 拍子の拍の数で数えた長さ（4/4・3/4 では四分音符、6/8 では付点四分音符で 1 小節は 2 拍）。省略時は 1 小節
        push:
          $ref: '#/components/schemas/Push'
    Push:
      description: 押し（BL-085）。和音を拍の頭より 8 分（eighth）か 16 分（sixteenth）早く弾き、そのままつなぐ。最初の和音には付けられない。省略時は押さない
      type: string
      enum: [eighth, sixteenth]
    TimelineResponse:
      type: object
      required: [timeline]
      properties:
        timeline:
          $ref: '#/components/schemas/Timeline'

    ChatMessage:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 1000
    IdeasRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ChatMessage'
    IdeaCandidate:
      description: LLM の提案（`intent.Candidate`）と、それを描画・分析したタイムライン
      type: object
      required: [title, key, tempoBpm, progression, beatsPerChord, reason, timeline]
      properties:
        title:
          type: string
        key:
          $ref: '#/components/schemas/Key'
        tempoBpm:
          type: number
          description: 拍子の拍が 1 分に何回か（4/4・3/4 では 4 分音符、6/8 では付点 4 分。ADR-0019）
          minimum: 40
          maximum: 220
        progression:
          type: array
          items:
            type: string
          description: ローマ数字（`ProgressionLabel.numeral` と同じ語彙）
        beatsPerChord:
          type: integer
          enum: [1, 2, 3, 4, 6, 8]
          description: 和音の長さ（拍子の拍の数）。`beats` がないときは全部の和音がこの長さ。4/4 では 1・2・4・8、3/4 では 3・6、6/8 では 1・2・4
        beats:
          type: array
          items:
            type: integer
            enum: [1, 2, 3, 4, 6, 8]
          description: 和音ごとの長さ（拍子の拍の数。BL-109）。`progression` と同じ数。省略時は全部が `beatsPerChord`
        reason:
          type: string
          description: 聴きどころの短い解説（1〜2 文の日本語）
        accompaniment:
          type: string
          description: 伴奏テンプレートの id（`GET /patterns`）。省略時はブロックコード
        drums:
          type: string
          description: ドラムテンプレートの id。省略時はドラムなし
        feel:
          $ref: '#/components/schemas/Feel'
        meter:
          type: string
          enum: ['4/4', '3/4', '6/8']
          description: 拍子。省略時は 4/4（ADR-0017）
        style:
          type: string
          enum: [pop, ballad, rock, jazz, bossa, celtic]
          description: 候補の音楽のスタイル（BL-082、ADR-0012）。伴奏・ドラム・ノリはこのスタイルに合うものに限られる。以前の候補にはない
        timeline:
          $ref: '#/components/schemas/Timeline'
    IdeasResponse:
      type: object
      required: [reply, mood, candidates]
      properties:
        reply:
          type: string
          description: 返答文。次のターンでは assistant の content としてそのまま送り返す
        mood:
          type: array
          items:
            type: string
        candidates:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/IdeaCandidate'

    # --- ドメインモデル（backend/internal/music と 1:1） --------------------
    PitchClass:
      type: integer
      minimum: 0
      maximum: 11
      description: 0 = C … 11 = B
    Pitch:
      type: integer
      minimum: 0
      maximum: 127
      description: MIDI ノート番号。60 = C4
    Mode:
      type: string
      enum: [major, minor, dorian, mixolydian]
      description: 長調、自然短音階、ドリアン、ミクソリディアン（ADR-0015）。ローマ数字はそのモードの音階に対して読む
    Key:
      type: object
      required: [tonic, mode]
      properties:
        tonic:
          $ref: '#/components/schemas/PitchClass'
        mode:
          $ref: '#/components/schemas/Mode'
    ChordQuality:
      type: string
      enum: [maj, min, dim, aug, maj7, min7, dom7, m7b5, min6, dim7, sus4, dom7sus4, power]
      description: min6 は短三和音に長 6 度を足した和音（長調で借用する ivm6）
    Chord:
      type: object
      required: [root, quality]
      properties:
        root:
          $ref: '#/components/schemas/PitchClass'
        quality:
          $ref: '#/components/schemas/ChordQuality'
    TimeSignature:
      type: object
      required: [numerator, denominator]
      properties:
        numerator:
          type: integer
          minimum: 1
          maximum: 32
        denominator:
          type: integer
          description: 2 のべき乗（32 まで）
          maximum: 32
    NoteEvent:
      type: object
      required: [pitch, velocity, start, duration]
      properties:
        pitch:
          $ref: '#/components/schemas/Pitch'
        velocity:
          type: integer
          minimum: 1
          maximum: 127
        start:
          type: integer
          minimum: 0
          description: tick
        duration:
          type: integer
          minimum: 1
          description: tick
    Track:
      type: object
      required: [name, channel, program, notes]
      properties:
        name:
          type: string
        channel:
          type: integer
          minimum: 0
          maximum: 15
          description: 0 始まり。9 は GM パーカッション
        program:
          type: integer
          minimum: 0
          maximum: 127
          description: GM プログラム番号（0 始まり）
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NoteEvent'
    HarmonyEvent:
      type: object
      required: [start, duration, chord, romanNumeral]
      properties:
        start:
          type: integer
          minimum: 0
        duration:
          type: integer
          minimum: 1
        chord:
          $ref: '#/components/schemas/Chord'
        romanNumeral:
          type: string
          examples: [I, ii, V7, 'vii°', 'I/3']
          description: ローマ数字。分数コードは `/` のあとにベースの度数（調の音階に対して。♭・♯ は b・#）を付ける（`I/3`、`i/#7`。ADR-0020）
        symbol:
          type: string
          description: 調に合わせて綴った和音記号（B♭ major では `Bbmaj7`。`chord` から機械的に作ると `A#maj7` になる）。エンジンが付ける。以前に保存したタイムラインにはない
          examples: [Bbmaj7, Gm7, 'A7', 'C/E']
        bass:
          $ref: '#/components/schemas/PitchClass'
          description: 分数コードのベース音（ADR-0020）。省略時は和音の根音がベース
        push:
          $ref: '#/components/schemas/Push'
          description: 押し（BL-085）。音は `start` より早く鳴るが、`start` は和音の属する拍のまま
        analysis:
          $ref: '#/components/schemas/HarmonyAnalysis'
          description: 解説データ。分析前のタイムラインでは省略される
    HarmonyAnalysis:
      description: 和声機能・ケーデンス・短い日本語の解説。決定論的に生成される
      type: object
      required: [degree, function, explanation]
      properties:
        degree:
          type: integer
          minimum: 1
          maximum: 7
        function:
          type: string
          enum: [T, S, D]
          description: トニック / サブドミナント / ドミナント
        cadence:
          type: string
          enum: [authentic, plagal, half, deceptive, modal]
          description: 直前のコードからこのコードへの進行が作る終止。modal はドリアン・ミクソリディアンの VII → I。該当なしのときは省略
        borrowed:
          type: boolean
          description: 同主短調から借りた和音（長調の iv・ivm6・ii°・♭VI・♭VII）のとき true。省略時 false
        appliedTo:
          type: integer
          minimum: 1
          maximum: 7
          description: セカンダリードミナント（V/x、V7/x）、裏コード（subV7/x）、導音の減七（vii°7/x）が向かう先の度数。それ以外の和音では省略
        substitute:
          type: boolean
          description: 裏コード（subV7/x、トライトーン代理。BL-128）のとき true。省略時 false
        leadingTone:
          type: boolean
          description: 向かう先の導音の上の減七（vii°7/x。BL-130）のとき true。省略時 false
        explanation:
          type: string
          description: UI にそのまま表示できる 1〜2 文の日本語
    Timeline:
      description: 再生・描画・解説・書き出しのすべてが消費する中心データ
      type: object
      required: [ppq, tempoBpm, timeSignature, key, tracks, harmony]
      properties:
        ppq:
          type: integer
          minimum: 1
          maximum: 32767
          description: 四分音符あたりの tick 数（既定 480）
        tempoBpm:
          type: number
          description: 拍子の拍が 1 分に何回か（4/4・3/4 では 4 分音符、6/8 では付点 4 分。ADR-0019）
          minimum: 10
          maximum: 1000
        timeSignature:
          $ref: '#/components/schemas/TimeSignature'
        key:
          $ref: '#/components/schemas/Key'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        harmony:
          type: array
          items:
            $ref: '#/components/schemas/HarmonyEvent'
        rhythm:
          $ref: '#/components/schemas/Rhythm'
          description: パターン適用後に付く解説データ。ブロックコードのみのタイムラインでは省略
        overview:
          $ref: '#/components/schemas/Overview'
          description: 例全体の解説。分析前のタイムラインでは省略
    Overview:
      description: 例全体の解説（全体と流れ）。決定論的に生成される
      type: object
      required: [whole, flow, degrees]
      properties:
        whole:
          type: string
          description: モードとその性格、特徴音を含む和音や借用和音。UI にそのまま出せる日本語
        flow:
          type: string
          description: 進行の長さ、始まり、終わりの終止、繰り返したときの戻り方。UI にそのまま出せる日本語
        degrees:
          type: array
          description: 調のモードのダイアトニックな三和音 7 つを、度数の順に（度数の地図。BL-099）
          items:
            $ref: '#/components/schemas/DegreeChord'
    DegreeChord:
      description: 度数の地図の 1 つの和音
      type: object
      required: [degree, romanNumeral, symbol, function]
      properties:
        degree:
          type: integer
          minimum: 1
          maximum: 7
        romanNumeral:
          type: string
          description: このモードでの三和音のローマ数字（例 ドリアンの IV）
        symbol:
          type: string
          description: 調に合わせて綴った和音名（例 G）
        function:
          type: string
          enum: [T, S, D]
          description: トニック / サブドミナント / ドミナント（個別の解説と同じ割り当て）
        used:
          type: boolean
          description: 例がこの度数の和音を調の和音として鳴らすとき true（七の和音や短調の V を含む。借用和音とセカンダリードミナントは含まない）。省略時 false
    Rhythm:
      type: object
      properties:
        accompaniment:
          $ref: '#/components/schemas/RhythmPart'
        drums:
          $ref: '#/components/schemas/RhythmPart'
        feel:
          $ref: '#/components/schemas/RhythmFeel'
        style:
          $ref: '#/components/schemas/RhythmStyle'
        drumGrid:
          $ref: '#/components/schemas/DrumGrid'
          description: ドラムが格子で書かれたときの格子（BL-123）。調やスタイルを変えて作り直すときに送り返す。このとき `drums.id` は `grid`
    DrumGrid:
      description: 1 小節のドラムの格子（BL-122、ADR-0012 の決定 2）。エンジンが検証し、問題をまとめて 400 で返す
      type: object
      required: [division, voices]
      properties:
        division: { type: integer, enum: [2, 3, 4, 6], description: 1 拍のマスの数。4/4・3/4 では 2・3・4、6/8 では 3・6 }
        voices:
          type: object
          description: 声部ごとの 1 小節。1 マス 1 文字で、X は強く、x は普通、o はゴースト、. は休み。空白と | は無視する。声部は kick, snare, cross-stick, hat, open-hat, pedal-hat, ride, ride-bell, crash, low-tom, mid-tom, high-tom
          additionalProperties: { type: string }
          examples:
            - { kick: 'x... x...', snare: '..x. ..x.', hat: 'xxxx xxxx' }
        basedOn: { type: string, description: もとにしたカタログのドラムの id }
    RhythmStyle:
      description: 例を描画したスタイル（BL-110）。調を変えて作り直すときに送り返す
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        instrument: { type: string, description: スタイルが和音に与えた楽器の名前。型が自分の楽器を持つときは省略 }
        tensions: { type: string, description: スタイルが和音に足したテンションの説明（BL-125）。鳴ったときだけ }
    RhythmFeel:
      description: ストレートでないときのノリの説明。決定論的に生成される
      type: object
      required: [id, name, explanation]
      properties:
        id:
          $ref: '#/components/schemas/Feel'
        name: { type: string }
        ratio: { type: number, minimum: 1, maximum: 3, description: スウィングの長・短の比（BL-084）。指定がなければテンポから決まる（60 で 3、160 で 2、速いほど浅く、1.5 まで） }
        unit: { type: string, enum: [eighth, sixteenth], description: 組にして揺らす音価 }
        explanation: { type: string }
    RhythmPart:
      description: 1 小節のパターンを初学者向けに説明したもの。決定論的に生成される
      type: object
      required: [id, name, description, hits, onBeat, offBeat, finer, syncopated, explanation]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        hits: { type: integer, description: 1 小節あたりの打点数（ドラムは骨格の打音だけ。キットならキックとスネア、ボーランのような手で叩く太鼓なら低いタムとサイドスティック。どちらもない格子ではすべての打） }
        onBeat: { type: integer, description: 拍の頭に乗る打点 }
        offBeat: { type: integer, description: 8 分の裏に乗る打点 }
        finer: { type: integer, description: それより細かい位置の打点 }
        syncopated: { type: boolean, description: 拍の裏で鳴ったあと、次の拍の頭が鳴らない打点がある（Longuet-Higgins & Lee。型は 1 小節を繰り返すので、最後の拍の次は次の小節の 1 拍目。BL-083） }
        explanation: { type: string, description: UI にそのまま出せる日本語 }
