openapi: 3.1.0
info:
  title: middy API
  version: 0.1.0
  description: |
    middy のバックエンド API。この文書が契約の正典であり（ADR-0004）、
    `backend/internal/httpapi` と `frontend/src/shared/api` はこれに追従する。

    `components.schemas` のドメインモデル部分は `backend/internal/music` の
    JSON 表現と 1:1 で対応する。
servers:
  - url: /api/v1
tags:
  - name: system
    description: 稼働確認
  - name: timelines
    description: タイムラインの生成と分析
  - name: export
    description: 書き出し
  - name: patterns
    description: 伴奏・ドラムのテンプレート
  - name: ideas
    description: イメージからの候補提案（S2）
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: サーバーの稼働状態を返す
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: dev
  /timelines/from-progression:
    post:
      tags: [timelines]
      operationId: createTimelineFromProgression
      summary: ローマ数字の進行を調で解決し、分析済みのタイムラインを返す
      description: |
        進行をブロックコード 1 トラックとして展開し（`music.FromProgression`）、
        各コードに和声機能・終止・解説を付けて（`music.Analyze`）返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromProgressionRequest'
            example:
              key: { tonic: 0, mode: major }
              tempoBpm: 90
              progression:
                - { numeral: I }
                - { numeral: V, beats: 2 }
                - { numeral: vi, beats: 2 }
                - { numeral: IV }
      responses:
        '200':
          description: 生成・分析済みのタイムライン
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '400':
          description: |
            `invalid_json`（本文が JSON として読めない、未知のフィールド、未知の mode）
            または `invalid_request`（進行が空、ローマ数字が不正、beats < 1、tempoBpm <= 0）。
            不正なローマ数字は全件まとめて message に列挙される
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /patterns:
    get:
      tags: [patterns]
      operationId: listPatterns
      summary: 伴奏とドラムのテンプレート一覧
      description: id を `POST /timelines/from-progression` の `accompaniment` / `drums` に渡す。
      responses:
        '200':
          description: カタログ（安定した順序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternsResponse'
  /export/midi:
    post:
      tags: [export]
      operationId: exportMidi
      summary: タイムラインを Standard MIDI File（format 0）として返す
      description: |
        `analysis` など再生に関係しないフィールドは無視される。
        トラックのチャンネルとプログラムは保持され、トラック名は保持されない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeline]
              properties:
                timeline:
                  $ref: '#/components/schemas/Timeline'
      responses:
        '200':
          description: 'SMF のバイト列。`Content-Disposition: attachment; filename="middy.mid"`'
          content:
            audio/midi:
              schema:
                type: string
                format: binary
        '400':
          description: "`invalid_json` または `invalid_request`（`Timeline.Validate` の失敗）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ideas:
    post:
      tags: [ideas]
      operationId: imagine
      summary: イメージの会話 1 ターン分を解釈し、再生可能な候補を返す
      description: |
        会話履歴（最後は user）を LLM に渡して `MusicalIntent` を得て、候補ごとに
        進行を調で解決・分析したタイムラインを返す（`ideas.Service.Imagine`）。
        サーバーは会話状態を持たない。assistant 側の履歴にはこの応答の `reply` を入れて送り返す。
        LLM が不正な答えを返した場合は検証エラーを添えて、安全上の理由で拒否した場合は同じ要求のまま、
        それぞれ 1 回だけ再試行する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeasRequest'
            example:
              messages:
                - { role: user, content: 雨の日曜の午後みたいな曲 }
      responses:
        '200':
          description: 返答と候補
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeasResponse'
        '400':
          description: "`invalid_json`、または `invalid_request`（空・20 件超・1000 文字超・最後が user でない）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: "`llm_declined`（プロバイダの安全機構が再試行後も拒否した。言い回しを変えれば通ることが多い）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: "`llm_unavailable`（プロバイダに到達できない）または `llm_invalid_output`（再試行後も使えない答え）"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: ビルド時に埋め込まれるバージョン。開発時は "dev"
    Error:
      description: すべてのエラー応答が使う共通エンベロープ
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: snake_case の安定した識別子（例 invalid_request）
            message:
              type: string
              description: 人間向けの説明。UI にそのまま出してよい

    FromProgressionRequest:
      type: object
      required: [key, tempoBpm, progression]
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/Key'
        tempoBpm:
          type: number
          exclusiveMinimum: 0
        progression:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProgressionLabel'
        accompaniment:
          type: string
          description: 伴奏テンプレートの id（`GET /patterns`）。省略時はブロックコード
        drums:
          type: string
          description: ドラムテンプレートの id（`GET /patterns`）。省略時はドラムなし
        feel:
          $ref: '#/components/schemas/Feel'
    Feel:
      type: string
      enum: [straight, swing]
      description: 8 分音符のノリ。swing は裏拍を 3 連符の 3 つ目まで遅らせる。伴奏かドラムがあるときに効く。省略時は straight
    PatternsResponse:
      type: object
      required: [accompaniments, drums, feels]
      properties:
        accompaniments:
          type: array
          items:
            $ref: '#/components/schemas/Accompaniment'
        drums:
          type: array
          items:
            $ref: '#/components/schemas/DrumPattern'
        feels:
          type: array
          items:
            $ref: '#/components/schemas/FeelInfo'
    FeelInfo:
      type: object
      required: [id, name, description]
      properties:
        id:
          $ref: '#/components/schemas/Feel'
        name: { type: string }
        description: { type: string, description: 学習者向けの説明（日本語） }
    Accompaniment:
      type: object
      required: [id, name, description, program, hits]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, description: 学習者向けの説明（日本語） }
        program: { type: integer, description: GM プログラム番号 }
        hits:
          type: array
          items:
            type: object
            required: [start, duration, voice, velocity]
            properties:
              start: { type: integer, description: 小節内の tick }
              duration: { type: integer }
              voice: { type: string, enum: [chord, bass, root, third, fifth, top, octave] }
              velocity: { type: integer, minimum: 1, maximum: 127 }
    DrumPattern:
      type: object
      required: [id, name, description, hits]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        hits:
          type: array
          items:
            type: object
            required: [start, duration, note, velocity]
            properties:
              start: { type: integer }
              duration: { type: integer }
              note: { type: integer, description: GM ドラムマップのノート番号 }
              velocity: { type: integer, minimum: 1, maximum: 127 }
    ProgressionLabel:
      type: object
      required: [numeral]
      additionalProperties: false
      properties:
        numeral:
          type: string
          description: |
            ローマ数字のコード名。度数（I..VII、大文字小文字は問わない）と、
            任意の七の和音指定（7, maj7, ø7, m7b5）。°, +, dim, aug は受理するが無視され、
            コードの質は調から決まる。例外は短調の大文字 V / V7 で、和声的短音階のドミナント
            （長三和音・属七）になる。小文字 v は自然短音階の短三和音
          examples: [I, ii, V7, IVmaj7, 'vii°']
        beats:
          type: integer
          minimum: 1
          default: 4
          description: 四分音符単位の長さ。省略時 4
    TimelineResponse:
      type: object
      required: [timeline]
      properties:
        timeline:
          $ref: '#/components/schemas/Timeline'

    ChatMessage:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 1000
    IdeasRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ChatMessage'
    IdeaCandidate:
      description: LLM の提案（`intent.Candidate`）と、それを描画・分析したタイムライン
      type: object
      required: [title, key, tempoBpm, progression, beatsPerChord, reason, timeline]
      properties:
        title:
          type: string
        key:
          $ref: '#/components/schemas/Key'
        tempoBpm:
          type: number
          minimum: 40
          maximum: 220
        progression:
          type: array
          items:
            type: string
          description: ローマ数字（`ProgressionLabel.numeral` と同じ語彙）
        beatsPerChord:
          type: integer
          enum: [1, 2, 4, 8]
        reason:
          type: string
          description: 聴きどころの短い解説（1〜2 文の日本語）
        accompaniment:
          type: string
          description: 伴奏テンプレートの id（`GET /patterns`）。省略時はブロックコード
        drums:
          type: string
          description: ドラムテンプレートの id。省略時はドラムなし
        feel:
          $ref: '#/components/schemas/Feel'
        timeline:
          $ref: '#/components/schemas/Timeline'
    IdeasResponse:
      type: object
      required: [reply, mood, candidates]
      properties:
        reply:
          type: string
          description: 返答文。次のターンでは assistant の content としてそのまま送り返す
        mood:
          type: array
          items:
            type: string
        candidates:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/IdeaCandidate'

    # --- ドメインモデル（backend/internal/music と 1:1） --------------------
    PitchClass:
      type: integer
      minimum: 0
      maximum: 11
      description: 0 = C … 11 = B
    Pitch:
      type: integer
      minimum: 0
      maximum: 127
      description: MIDI ノート番号。60 = C4
    Mode:
      type: string
      enum: [major, minor, dorian, mixolydian]
      description: 長調、自然短音階、ドリアン、ミクソリディアン（ADR-0015）。ローマ数字はそのモードの音階に対して読む
    Key:
      type: object
      required: [tonic, mode]
      properties:
        tonic:
          $ref: '#/components/schemas/PitchClass'
        mode:
          $ref: '#/components/schemas/Mode'
    ChordQuality:
      type: string
      enum: [maj, min, dim, aug, maj7, min7, dom7, m7b5, min6]
      description: min6 は短三和音に長 6 度を足した和音（長調で借用する ivm6）
    Chord:
      type: object
      required: [root, quality]
      properties:
        root:
          $ref: '#/components/schemas/PitchClass'
        quality:
          $ref: '#/components/schemas/ChordQuality'
    TimeSignature:
      type: object
      required: [numerator, denominator]
      properties:
        numerator:
          type: integer
          minimum: 1
        denominator:
          type: integer
          description: 2 のべき乗
    NoteEvent:
      type: object
      required: [pitch, velocity, start, duration]
      properties:
        pitch:
          $ref: '#/components/schemas/Pitch'
        velocity:
          type: integer
          minimum: 1
          maximum: 127
        start:
          type: integer
          minimum: 0
          description: tick
        duration:
          type: integer
          minimum: 1
          description: tick
    Track:
      type: object
      required: [name, channel, program, notes]
      properties:
        name:
          type: string
        channel:
          type: integer
          minimum: 0
          maximum: 15
          description: 0 始まり。9 は GM パーカッション
        program:
          type: integer
          minimum: 0
          maximum: 127
          description: GM プログラム番号（0 始まり）
        notes:
          type: array
          items:
            $ref: '#/components/schemas/NoteEvent'
    HarmonyEvent:
      type: object
      required: [start, duration, chord, romanNumeral]
      properties:
        start:
          type: integer
          minimum: 0
        duration:
          type: integer
          minimum: 1
        chord:
          $ref: '#/components/schemas/Chord'
        romanNumeral:
          type: string
          examples: [I, ii, V7, 'vii°']
        symbol:
          type: string
          description: 調に合わせて綴った和音記号（B♭ major では `Bbmaj7`。`chord` から機械的に作ると `A#maj7` になる）。エンジンが付ける。以前に保存したタイムラインにはない
          examples: [Bbmaj7, Gm7, 'A7']
        analysis:
          $ref: '#/components/schemas/HarmonyAnalysis'
          description: 解説データ。分析前のタイムラインでは省略される
    HarmonyAnalysis:
      description: 和声機能・ケーデンス・短い日本語の解説。決定論的に生成される
      type: object
      required: [degree, function, explanation]
      properties:
        degree:
          type: integer
          minimum: 1
          maximum: 7
        function:
          type: string
          enum: [T, S, D]
          description: トニック / サブドミナント / ドミナント
        cadence:
          type: string
          enum: [authentic, plagal, half, deceptive, modal]
          description: 直前のコードからこのコードへの進行が作る終止。modal はドリアン・ミクソリディアンの VII → I。該当なしのときは省略
        borrowed:
          type: boolean
          description: 同主短調から借りた和音（長調の iv・ivm6・ii°・♭VI・♭VII）のとき true。省略時 false
        explanation:
          type: string
          description: UI にそのまま表示できる 1〜2 文の日本語
    Timeline:
      description: 再生・描画・解説・書き出しのすべてが消費する中心データ
      type: object
      required: [ppq, tempoBpm, timeSignature, key, tracks, harmony]
      properties:
        ppq:
          type: integer
          minimum: 1
          description: 四分音符あたりの tick 数（既定 480）
        tempoBpm:
          type: number
          exclusiveMinimum: 0
        timeSignature:
          $ref: '#/components/schemas/TimeSignature'
        key:
          $ref: '#/components/schemas/Key'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        harmony:
          type: array
          items:
            $ref: '#/components/schemas/HarmonyEvent'
        rhythm:
          $ref: '#/components/schemas/Rhythm'
          description: パターン適用後に付く解説データ。ブロックコードのみのタイムラインでは省略
    Rhythm:
      type: object
      properties:
        accompaniment:
          $ref: '#/components/schemas/RhythmPart'
        drums:
          $ref: '#/components/schemas/RhythmPart'
        feel:
          $ref: '#/components/schemas/RhythmFeel'
    RhythmFeel:
      description: ストレートでないときのノリの説明。決定論的に生成される
      type: object
      required: [id, name, explanation]
      properties:
        id:
          $ref: '#/components/schemas/Feel'
        name: { type: string }
        explanation: { type: string }
    RhythmPart:
      description: 1 小節のパターンを初学者向けに説明したもの。決定論的に生成される
      type: object
      required: [id, name, description, hits, onBeat, offBeat, finer, syncopated, explanation]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        hits: { type: integer, description: 1 小節あたりの打点数（ドラムはキックとスネアのみ） }
        onBeat: { type: integer, description: 拍の頭に乗る打点 }
        offBeat: { type: integer, description: 8 分の裏に乗る打点 }
        finer: { type: integer, description: それより細かい位置の打点 }
        syncopated: { type: boolean, description: 裏拍の割合が 4 分の 1 以上 }
        explanation: { type: string, description: UI にそのまま出せる日本語 }
